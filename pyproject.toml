[project]
name = "predictive-ultra"
version = "1.0.0"
description = "Standalone text classification pipeline with XGBoost, hybrid embeddings, SHAP, calibration, and model comparison"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Peter Pang", email = "peter.pang@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "imbalanced-learn>=0.11.0",
    "shap>=0.42.0",
    "scipy>=1.10.0",
    "joblib>=1.2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
